# Продакшен: docker compose -f docker-compose.prod.yml up -d --build
# Инструкция — deploy/README.md. Настройки — .env (образец: deploy/env.production.example).
# Наружу открыты только 80 и 443 (Caddy, автоматический HTTPS); база, Redis и сервисы — во внутренней сети.
name: ryadom

x-app: &app
  image: ryadom:latest
  build: .
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    REDIS_URL: redis://redis:6379
    PHOTO_STORAGE_DIR: /data/photos
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?задайте POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:?задайте POSTGRES_DB в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Миграции перед запуском сайта; завершается сам.
  migrate:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "cd packages/db && exec node_modules/.bin/prisma migrate deploy"]

  web:
    <<: *app
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - photos:/data/photos
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  realtime:
    <<: *app
    command: ["sh", "-c", "cd apps/realtime && exec node_modules/.bin/tsx src/index.ts"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Без TELEGRAM_BOT_TOKEN бот завершается и не перезапускается.
  bot:
    <<: *app
    restart: on-failure
    command: ["sh", "-c", "cd apps/bot && exec node_modules/.bin/tsx src/index.ts"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, realtime]

  # Служебные команды: docker compose -f docker-compose.prod.yml run --rm tools pnpm venues:import --all
  tools:
    <<: *app
    restart: "no"
    profiles: [tools]
    volumes:
      - photos:/data/photos
    command: ["pnpm", "check:env"]

volumes:
  pgdata:
  redisdata:
  photos:
  caddy_data:
  caddy_config:
